name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Diagnose corpus tests
        continue-on-error: true
        run: node --test test/java-content-50.test.js
      - name: Diagnose batch contract
        continue-on-error: true
        run: node --test test/java-content-150.test.js
      - name: Diagnose learning map
        continue-on-error: true
        run: node --test test/java-learning-map.test.js
      - name: Diagnose template foundation
        continue-on-error: true
        run: node --test test/template-foundation.test.js
      - name: Diagnose template genericity
        continue-on-error: true
        run: node --test test/template-genericity.test.js
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
