name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test corpus integrity
        run: node --test test/java-content-50.test.js
      - name: Test content batch contract
        run: node --test test/java-content-150.test.js
      - name: Test learning map
        run: node --test test/java-learning-map.test.js
      - name: Test template foundation
        run: node --test test/template-foundation.test.js
      - name: Test template genericity
        run: node --test test/template-genericity.test.js
      - name: Build
        run: npm run build
