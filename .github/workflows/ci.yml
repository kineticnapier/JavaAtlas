name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Diagnose Java config
        continue-on-error: true
        run: node --test --test-name-pattern="config is Java-specific" test/java-content-50.test.js
      - name: Diagnose corpus parity
        continue-on-error: true
        run: node --test --test-name-pattern="exactly 350" test/java-content-50.test.js
      - name: Diagnose runtime localization
        continue-on-error: true
        run: node --test --test-name-pattern="localized at runtime" test/java-content-50.test.js
      - name: Diagnose quest code
        continue-on-error: true
        run: node --test --test-name-pattern="inherit representative code" test/java-content-50.test.js
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
